    <main id="main-landmark">
      <div class="toolbar">

      <article id="article-landmark">
        <h1 id="title">Two landmarks, one article</h1>
        <p id="body-1">
          Pages often declare a main region and an article inside it. The article is the narrower
          and better answer.
        </p>
        <p id="body-2">
          Preferring the outer landmark would drag toolbars and related links into the reading set.
        </p>
      </article>
