post:
  summary: Create Billing Checkout
  operationId: createBillingCheckout
  parameters:
  - name: authorization
    in: header
    required: false
    schema:
      anyOf:
      - type: string
      - type: 'null'
      title: Authorization
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CheckoutRequest.yaml
        examples:
          happy:
            summary: Deterministic local request
            x-contract-test-case: happy
            value:
              plan: pro
  responses:
    '200':
      description: Successful Response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CheckoutResponse.yaml
          examples:
            happy:
              summary: Deterministic local response
              x-contract-test-case: happy
              value:
                url: https://billing.example.test/checkout/fake
                activated: false
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ApiError.yaml
          example:
            detail: The request is invalid.
    '403':
      description: Account access forbidden
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ApiError.yaml
          example:
            detail: Account is suspended.
            code: account_suspended
    '401':
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ApiError.yaml
          example:
            detail: Authentication failed.
    '409':
      description: Conflict
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ApiError.yaml
          example:
            detail: The operation conflicts with existing state.
    '422':
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ApiError.yaml
          example:
            detail: Request validation failed.
    '502':
      description: Upstream provider failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ApiError.yaml
          example:
            detail: The provider request failed.
  x-contract-test:
    mode: manual
    auth: localBearer
    setup: mockBilling
    owner: billing
    reason: Checkout creates provider-owned billing state.
    test: backend/test_openapi_manual_contract.py::test_create_billing_checkout
  security:
  - bearerAuth: []
