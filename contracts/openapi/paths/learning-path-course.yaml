get:
  operationId: getLearningPathCourse
  summary: Get a course in a learning path
  parameters:
    - name: pathId
      in: path
      required: true
      schema:
        type: string
    - name: courseId
      in: path
      required: true
      schema:
        type: string
  responses:
    "200":
      description: Course.
      content:
        application/json:
          schema:
            $ref: "../components/schemas/Course.yaml"
          example:
            id: starter
            title: TOEIC Starter
            levelLabel: First TOEIC course
            description: Start with common office verbs, nouns, and short expressions that make TOEIC passages easier to read.
            outcome: Recognize basic workplace vocabulary and understand short business sentences.
            estimatedHours: 4
            units:
              - id: basic-business-verbs-01
                title: Basic Business Verbs 01
                description: Core action verbs that appear in announcements, emails, and short notices.
                targetSkill: Understand common business actions
                durationMinutes: 8
                vocabularyEntries:
                  - id: apply
                    targetText: apply
                    kind: word
                    sourceMeaning: 応募する、申請する。ルールなどを適用する意味でも使う。
                    targetExampleSentence: Please apply for the position by Friday.
                    sourceExampleTranslation: 金曜日までにその職種へ応募してください。
                    progressStatus: remembered
                    exampleSentences:
                      - id: 019730f0-8b95-7f7d-9f65-bf5e18c7b5a1
                        targetText: apply
                        targetSentence: I applied the new vocabulary to a short email about my work.
                        sourceTranslation: 私は仕事に関する短いメールに新しい語彙を応用しました。
                        variant: personalized
                        personalization:
                          contextSummary: Workplace email practice context.
                        usageNote: Use apply when putting knowledge, rules, or skills into practice.
                  - id: attend
                    targetText: attend
                    kind: word
                    sourceMeaning: 会議・イベント・授業などに出席する。
                    targetExampleSentence: All team members must attend the safety meeting.
                    sourceExampleTranslation: すべてのチームメンバーは安全会議に出席しなければなりません。
                    progressStatus: learning
                  - id: confirm
                    targetText: confirm
                    kind: word
                    sourceMeaning: 予約・予定・内容などが正しいことを確認する。
                    targetExampleSentence: Please confirm your reservation by email.
                    sourceExampleTranslation: メールで予約内容を確認してください。
                    progressStatus: notStarted
              - id: office-nouns-01
                title: Office Nouns 01
                description: Basic nouns used in schedules, applications, invoices, and workplace notices.
                targetSkill: Read short office-related passages
                durationMinutes: 8
                vocabularyEntries:
                  - id: department
                    targetText: department
                    kind: word
                    sourceMeaning: 会社や組織の部署、部門。
                    targetExampleSentence: The marketing department moved to the third floor.
                    sourceExampleTranslation: マーケティング部は3階へ移動しました。
                    progressStatus: remembered
    "404":
      description: Course not found.
