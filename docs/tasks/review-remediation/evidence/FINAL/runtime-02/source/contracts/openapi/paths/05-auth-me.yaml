get:
  summary: Get Auth Me
  operationId: getCurrentUser
  parameters:
  - name: authorization
    in: header
    required: false
    schema:
      anyOf:
      - type: string
      - type: 'null'
      title: Authorization
  responses:
    '200':
      description: Successful Response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/User.yaml
          examples:
            happy:
              summary: Deterministic local response
              x-contract-test-case: happy
              value:
                id: 018f47a2-7b3c-7abc-8def-0123456789ab
                email: learner@example.test
                display_name: Learner
    '401':
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ApiError.yaml
          example:
            detail: Authentication failed.
    '422':
      description: Validation Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/HTTPValidationError.yaml
          example:
            detail:
            - type: value_error
              loc:
              - body
              - field
              msg: Request validation failed.
              input: null
  x-contract-test:
    mode: generic
    auth: localBearer
    setup: authenticatedUser
    owner: auth
  security:
  - bearerAuth: []
