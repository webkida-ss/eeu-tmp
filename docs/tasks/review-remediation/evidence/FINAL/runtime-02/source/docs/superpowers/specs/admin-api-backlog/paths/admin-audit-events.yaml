# Historical design proposal; not a supported runtime contract.
get:
  operationId: listAdminAuditEvents
  summary: Filter and page immutable administration audit events
  security:
    - bearerAuth: []
  parameters:
    - name: start
      in: query
      description: Inclusive recorded-at boundary.
      schema:
        type: string
        format: date-time
      example: "2026-06-20T00:00:00Z"
    - name: end
      in: query
      description: Exclusive recorded-at boundary.
      schema:
        type: string
        format: date-time
      example: "2026-07-20T00:00:00Z"
    - name: actor_user_id
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 200
    - name: target_user_id
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 200
      example: user-17
    - name: action
      in: query
      schema:
        type: string
        enum: [user_suspended, user_reactivated]
    - name: cursor
      in: query
      description: Opaque cursor returned by the previous page.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    "200":
      description: A deterministic cursor page of audit events.
      headers:
        X-Correlation-ID:
          $ref: ../admin-openapi.yaml#/components/headers/CorrelationId
      content:
        application/json:
          schema:
            $ref: ../admin-openapi.yaml#/components/schemas/AuditEventPage
    "401":
      $ref: ../admin-openapi.yaml#/components/responses/Unauthenticated
    "403":
      $ref: ../admin-openapi.yaml#/components/responses/AdminForbidden
    "422":
      $ref: ../admin-openapi.yaml#/components/responses/ValidationError
    "500":
      $ref: ../admin-openapi.yaml#/components/responses/InternalError
