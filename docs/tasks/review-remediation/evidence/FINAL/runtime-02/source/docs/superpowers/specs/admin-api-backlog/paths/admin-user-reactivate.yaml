# Historical design proposal; not a supported runtime contract.
post:
  operationId: reactivateAdminUser
  summary: Reactivate a user account
  description: The transition is idempotent and appends an audit event only when the state changes.
  security:
    - bearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      description: Opaque user identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 200
      example: user-17
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../admin-openapi.yaml#/components/schemas/AccountTransitionRequest
        example:
          reason: Investigation completed with no remaining concern.
  responses:
    "200":
      description: Current account state and transition outcome.
      headers:
        X-Correlation-ID:
          $ref: ../admin-openapi.yaml#/components/headers/CorrelationId
      content:
        application/json:
          schema:
            $ref: ../admin-openapi.yaml#/components/schemas/AccountTransitionResponse
    "401":
      $ref: ../admin-openapi.yaml#/components/responses/Unauthenticated
    "403":
      $ref: ../admin-openapi.yaml#/components/responses/AdminForbidden
    "404":
      $ref: ../admin-openapi.yaml#/components/responses/UserNotFound
    "422":
      $ref: ../admin-openapi.yaml#/components/responses/ValidationError
    "500":
      $ref: ../admin-openapi.yaml#/components/responses/InternalError
