name: Bug report
description: Report a reproducible product or developer-workflow defect
title: "[bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: Do not include secrets, access tokens, private user data, or production logs.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal, safe steps and fixture data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Branch name or commit SHA, if known.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, and relevant managed tool versions.
