get:
  summary: Get Vocabulary Book
  operationId: getVocabularyBook
  parameters:
  - name: authorization
    in: header
    required: false
    schema:
      anyOf:
      - type: string
      - type: 'null'
      title: Authorization
  responses:
    '200':
      description: Successful Response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/VocabularyBookResponse.yaml
          examples:
            happy:
              summary: Deterministic local response
              x-contract-test-case: happy
              value:
                items: []
                preload_count: 0
    '403':
      description: Account access forbidden
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ApiError.yaml
          example:
            detail: Account is suspended.
            code: account_suspended
    '401':
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ApiError.yaml
          example:
            detail: Authentication failed.
    '422':
      description: Validation Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/HTTPValidationError.yaml
          example:
            detail:
            - type: value_error
              loc:
              - body
              - field
              msg: Request validation failed.
              input: null
  x-contract-test:
    mode: generic
    auth: localBearer
    setup: emptyRepositories
    owner: reading
  security:
  - bearerAuth: []
